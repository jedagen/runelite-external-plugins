# RuneLite Debug Logging Configuration
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler

# Console handler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %2$s: %5$s%6$s%n

# File handler
java.util.logging.FileHandler.pattern=runelite-debug-%g.log
java.util.logging.FileHandler.limit=50000
java.util.logging.FileHandler.count=1
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# Root logger level
.level=ALL

# RuneLite specific logging
net.runelite.level=ALL
net.runelite.client.plugins.level=ALL
net.runelite.client.PluginManager.level=ALL
net.runelite.client.ExternalPluginManager.level=ALL

# Plugin discovery logging
net.runelite.client.plugins.Plugin.level=ALL
net.runelite.client.plugins.PluginDescriptor.level=ALL

# Console output
java.util.logging.ConsoleHandler.level=ALL
